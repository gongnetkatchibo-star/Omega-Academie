# Site nginx de Toumaï Edu School.
# deploiement/installer.sh le met en place ; à la main : le copier dans
# /etc/nginx/sites-available/toumai, remplacer « _ » par le nom de
# domaine, puis l'activer (lien dans sites-enabled) et recharger nginx.
# Le certificat https s'ajoute ensuite avec : certbot --nginx -d ecole.example
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Même limite que l'application (20 Mo par fichier envoyé).
    client_max_body_size 20m;

    # Pages et feuilles de style compressées : moins de données mobiles.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fichiers fixes (styles, polices, images) servis directement. Leur
    # adresse change à chaque mise à jour (?v=…) : ils peuvent rester
    # longtemps en mémoire du navigateur.
    location /static/ {
        alias /opt/toumai_edu_school/app/static/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
