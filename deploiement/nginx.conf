# Site nginx (à copier dans /etc/nginx/sites-available/toumai, puis lien
# dans sites-enabled). Remplacer ecole.example par le nom de domaine.
# Le certificat https s'ajoute ensuite avec : certbot --nginx -d ecole.example
server {
    listen 80;
    server_name ecole.example;

    # Même limite que l'application (20 Mo par fichier envoyé).
    client_max_body_size 20m;

    location /static/ {
        alias /opt/toumai_edu_school/app/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
