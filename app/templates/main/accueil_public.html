{% extends "base.html" %}
{% block title %}{{ nom_plateforme() }}{% endblock %}
{% block content %}
  <section class="hero">
    <h1>{{ nom_plateforme() }}</h1>
    <p class="hero-texte">Gestion scolaire : inscriptions, notes, finances, emploi du temps et communication.</p>
    <div class="hero-actions">
      <a class="bouton-principal" href="{{ url_for('auth.connexion') }}">Se connecter</a>
      <a class="bouton-secondaire" href="{{ url_for('auth.inscription') }}">Créer un compte</a>
    </div>
  </section>

  <footer class="pied-accueil">
    <p>{{ nom_plateforme() }}</p>
  </footer>
{% endblock %}
