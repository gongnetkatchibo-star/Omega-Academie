<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: Helvetica, Arial, sans-serif; color: #0F5FA6; font-size: 11px; }
  h1 { color: #0F5FA6; font-size: 18px; margin-bottom: 2px; }
  h2 { color: #555555; font-size: 13px; font-weight: normal; margin-top: 0; }
  table { width: 100%; margin-top: 14px; }
  th { background-color: #0F5FA6; color: #FFFFFF; padding: 6px; font-size: 10px; text-align: left; }
  td { border-bottom: 1px solid #dddddd; padding: 6px; font-size: 10px; }
  tr:nth-child(even) td { background-color: #F4F1E8; }
  .entete { border-bottom: 2px solid #00A99D; padding-bottom: 8px; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="entete">
    <h1>{{ etablissement }} — {{ titre }}</h1>
    {% if sous_titre %}<h2>{{ sous_titre }}</h2>{% endif %}
  </div>
  <table>
    <thead><tr>{% for e in entetes %}<th>{{ e }}</th>{% endfor %}</tr></thead>
    <tbody>
      {% for ligne in lignes %}
        <tr>{% for val in ligne %}<td>{{ val }}</td>{% endfor %}</tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
